name: Keep Render service awake

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 https://videogames-api-wjej.onrender.com/api-docs > /dev/null
